name: Release

# Gera os instaladores de macOS e Windows e cria um rascunho de Release no GitHub.
# Dispare criando uma tag (ex.: git tag v0.2.0 && git push origin v0.2.0)
# ou manualmente pela aba Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Formaty ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: Baixe o `.dmg` para macOS ou o `.msi`/`-setup.exe` para Windows.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
