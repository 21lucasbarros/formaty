<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40a9ff"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b9dff"/>
      <stop offset="1" stop-color="#5146e8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
    <clipPath id="card">
      <rect x="282" y="322" width="400" height="380" rx="60"/>
    </clipPath>
  </defs>

  <!-- Fundo (grade de ícones do macOS: 824px com 100px de margem) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <!-- Cartão de trás -->
  <rect x="352" y="262" width="400" height="380" rx="60" fill="#fff" fill-opacity="0.35"
        transform="rotate(9 552 452)"/>

  <!-- Cartão da frente -->
  <g transform="rotate(-5 482 512)" filter="url(#shadow)">
    <rect x="282" y="322" width="400" height="380" rx="60" fill="#fff"/>
    <g clip-path="url(#card)">
      <circle cx="580" cy="430" r="42" fill="#ffb340"/>
      <path d="M262 720 L405 520 Q420 500 435 520 L520 630 L560 585 Q575 568 590 585 L700 720 Z" fill="url(#hill)"/>
    </g>
  </g>

  <!-- Selo de conversão -->
  <g filter="url(#shadow)">
    <circle cx="690" cy="690" r="118" fill="#fff"/>
  </g>
  <g fill="none" stroke="#4f46e5" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M632 662 H742 M714 634 L742 662 L714 690"/>
    <path d="M748 724 H638 M666 696 L638 724 L666 752"/>
  </g>
</svg>
